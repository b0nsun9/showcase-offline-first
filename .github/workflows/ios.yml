name: iOS

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [develop, main]
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  domain:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - run: ios/scripts/check-domain-imports.sh
      - run: swift test --package-path ios/Packages/Domain
      - run: swift test --package-path ios/Packages/Data
        env:
          SHOWCASE_DEV_API_KEY: ${{ secrets.SHOWCASE_DEV_API_KEY }}
      - run: xcodebuild build -project ios/FieldJobs.xcodeproj -scheme FieldJobs -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
      - name: App tests on the newest iPhone simulator
        run: |
          # simctl lists runtimes oldest first, so the last iPhone is on the newest runtime.
          DEST_ID=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | tail -1 | grep -oE '[0-9A-F-]{36}')
          xcodebuild test -project ios/FieldJobs.xcodeproj -scheme FieldJobs -destination "id=$DEST_ID"
